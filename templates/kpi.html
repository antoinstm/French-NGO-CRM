{% extends "base.html" %}
{% block title %}Indicateurs{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Indicateurs</h1>
</div>

<p>Élu·es en poste dans la base : <strong>{{ total_elus }}</strong></p>

<div class="table-wrap">
  <table>
    <thead>
      <tr><th>Position sur PauseIA</th><th>Nombre</th></tr>
    </thead>
    <tbody>
      {% for ligne in par_position %}
      <tr>
        <td>{{ ligne.stance or "Non renseigné" }}</td>
        <td>{{ ligne.n }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
